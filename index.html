<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unlock preview – Makeitspicy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0206;
  --text: #fdf4f8;
  --text-2: #e7c6d5;
  --muted: #b98ea3;
  --line-2: rgba(255, 140, 190, .26);
  --pink: #fc2c86;
  --pink-soft: #ffa7cf;
  --violet: #805dfa;
  --gold-text: #ffd351;
  /* button gradient sampled from the pricing screen */
  --pv-grad: linear-gradient(96deg, #7b52ff 0%, #9a4bf0 40%, #e046bf 78%, #e83f9e 100%);
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* Makeitspicy is dark-only by design; both theme hooks resolve to the same palette. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0a0206; --text: #fdf4f8; } }
:root[data-theme="dark"] { --bg: #0a0206; --text: #fdf4f8; }
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background-color: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  display: grid; place-items: center; padding: 1.5rem;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(46rem 30rem at 12% -6%, rgba(140, 40, 220, .3), transparent 60%),
    radial-gradient(46rem 34rem at 92% 100%, rgba(224, 60, 180, .26), transparent 62%),
    var(--bg);
  background-repeat: no-repeat;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--pink-soft); outline-offset: 3px; }

/* ---------- Card ---------- */
.card {
  position: relative; overflow: hidden; isolation: isolate;
  width: min(24rem, 100%); aspect-ratio: 3 / 4.6; border-radius: 1.9rem;
  display: flex; flex-direction: column;
  animation: in .5s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes in { from { opacity: 0; transform: translateY(1rem) scale(.98); } to { opacity: 1; transform: none; } }
/* Glowing animated frame like the pricing card ribbons */
.card::before {
  content: ""; position: absolute; inset: 0; z-index: 4; border-radius: inherit; padding: 2px; pointer-events: none;
  background: conic-gradient(from var(--a, 0deg), #7b52ff, #e046bf, #e83f9e, #7b52ff);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.card::after { content: ""; position: absolute; inset: -2px; z-index: -1; border-radius: inherit; background: linear-gradient(120deg, rgba(123, 82, 255, .5), rgba(224, 70, 191, .5)); filter: blur(22px); opacity: .8; }

.bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.blurwrap { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.blurwrap .scene { position: absolute; inset: 0; filter: blur(30px) saturate(1.2) brightness(.9); transform: scale(1.2); transition: filter .8s ease, transform .8s ease; }
.veil { position: absolute; inset: 0; z-index: 1; background: radial-gradient(80% 60% at 50% 30%, rgba(224, 70, 191, .12), transparent 60%), linear-gradient(180deg, rgba(12, 3, 8, .35), rgba(12, 3, 8, .55)); transition: background .6s ease; }

/* CSS-art preview scene (neutral) */
.scene { background: linear-gradient(180deg, #23205e 0%, #4b3a8e 40%, #9a5aa8 70%, #e0a08e 100%); }
.scene::before { content: ""; position: absolute; left: 50%; top: 30%; width: 34%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, #ffe6c0, #ffb27a 70%); box-shadow: 0 0 4rem rgba(255, 180, 120, .5); }
.scene::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: 0; height: 46%; background: linear-gradient(180deg, rgba(30,20,60,.2), #2a1a4e); clip-path: polygon(0 46%, 20% 12%, 42% 34%, 62% 6%, 82% 28%, 100% 14%, 100% 100%, 0 100%); }

/* Top row */
.top { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 1.1rem; }
.badge { display: inline-flex; align-items: center; gap: .45rem; height: 2rem; padding: 0 .9rem; border-radius: 999px; font-size: .8rem; font-weight: 700; letter-spacing: .04em; color: #fff; background: rgba(20, 8, 24, .5); border: 1px solid rgba(224, 70, 191, .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.badge svg { width: .95rem; height: .95rem; color: var(--pink-soft); }
.close { width: 2.4rem; height: 2.4rem; border-radius: 50%; display: grid; place-items: center; background: rgba(12, 4, 10, .5); border: 1px solid rgba(255, 255, 255, .22); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: background-color .2s ease, transform .2s ease; }
.close:hover { background: rgba(50, 14, 36, .7); transform: rotate(90deg); }
.close svg { width: 1.05rem; height: 1.05rem; }

/* Corner thumbnail (neutral scene) */
.thumb { position: absolute; top: 3.7rem; left: 1.1rem; z-index: 3; width: 5.25rem; height: 6.75rem; border-radius: 1rem; overflow: hidden; border: 2px solid rgba(224, 70, 191, .7); box-shadow: 0 .75rem 1.75rem rgba(0, 0, 0, .5), 0 0 1.4rem rgba(224, 70, 191, .5); }
.thumb .scene { position: absolute; inset: 0; }

/* Center lock cluster */
.center { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 0 1.5rem; text-align: center; transition: opacity .4s ease; }
.eye { position: relative; width: 5rem; height: 5rem; border-radius: 50%; display: grid; place-items: center; background: rgba(20, 8, 20, .45); border: 1px solid rgba(255, 255, 255, .28); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 0 2rem rgba(224, 70, 191, .4); }
.eye::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: conic-gradient(from var(--a, 0deg), transparent, rgba(224, 70, 191, .8), transparent 55%); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); }
.eye svg { width: 2rem; height: 2rem; color: #fff; opacity: .92; }
.center h2 { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; }
.center p { margin: 0; max-width: 16rem; font-size: .92rem; line-height: 1.5; color: var(--text-2); }
.perks { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-top: .25rem; }
.perk { display: inline-flex; align-items: center; gap: .35rem; height: 1.9rem; padding: 0 .75rem; border-radius: 999px; font-size: .75rem; font-weight: 600; color: #ffd6ee; background: rgba(224, 70, 191, .14); border: 1px solid rgba(224, 70, 191, .4); }
.perk svg { width: .8rem; height: .8rem; color: var(--pink); }

/* Bottom actions */
.actions { position: relative; z-index: 3; margin-top: auto; padding: 1.25rem; display: grid; gap: .7rem; }
.unlock {
  position: relative; overflow: hidden; height: 3.75rem; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
  font-size: 1.15rem; font-weight: 800; color: #fff;
  background: var(--pv-grad);
  box-shadow: 0 0 2rem rgba(224, 70, 191, .5), 0 .6rem 1.6rem rgba(123, 82, 255, .3), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: filter .2s ease, transform .15s ease;
}
.unlock:hover { filter: brightness(1.07); } .unlock:active { transform: scale(.99); }
.unlock svg.lock { width: 1.2rem; height: 1.2rem; }
.unlock .cost { display: inline-flex; align-items: center; gap: .3rem; margin-left: .15rem; padding: .28rem .6rem; border-radius: 999px; background: rgba(20, 4, 30, .4); font-size: .98rem; color: var(--gold-text); }
.unlock .cost .coin { width: 1.15rem; height: 1.15rem; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #fff3a6 0 10%, #ffd83f 34%, #f7ad10 72%, #dc8d00 100%); box-shadow: inset 0 -1px 2px rgba(150, 80, 0, .4); }
.unlock::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 24%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-18deg); animation: sheen 3.2s ease-in-out 1s infinite; }
@keyframes sheen { 0% { left: -40%; } 45%, 100% { left: 130%; } }
.subhint { text-align: center; font-size: .78rem; color: var(--muted); }
.subhint b { color: var(--gold-text); }

/* Unlocked state */
.card.unlocked .scene { filter: none; transform: none; }
.card.unlocked .veil { background: linear-gradient(180deg, transparent 45%, rgba(10, 3, 8, .55)); }
.card.unlocked .center { opacity: 0; pointer-events: none; }
.card.unlocked .unlock { background: rgba(20, 8, 16, .55); border: 1px solid rgba(224, 70, 191, .5); box-shadow: none; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.card.unlocked .unlock::after { display: none; }
.card.unlocked .subhint { visibility: hidden; }

/* Coin burst */
.burst { position: fixed; z-index: 50; pointer-events: none; width: 1rem; height: 1rem; border-radius: 50%; }

@media (prefers-reduced-motion: no-preference) {
  .card::before, .eye::before { animation: spin 6s linear infinite; }
  @keyframes spin { to { --a: 360deg; } }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
@media (max-width: 420px) { .card { width: 100%; } .center h2 { font-size: 1.2rem; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.7a2 2 0 0 0 2.8 2.8M9.4 5.2A9.7 9.7 0 0 1 12 5c6 0 9.5 7 9.5 7a16 16 0 0 1-3.3 4M6.1 6.2A16 16 0 0 0 2.5 12S6 19 12 19a9.6 9.6 0 0 0 4-.86" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1c.9 6.2 4.8 10.1 11 11-6.2.9-10.1 4.8-11 11-.9-6.2-4.8-10.1-11-11 6.2-.9 10.1-4.8 11-11Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<section class="card" id="card" role="dialog" aria-label="Locked preview">
  <div class="blurwrap" aria-hidden="true"><div class="scene"></div></div>
  <div class="veil" aria-hidden="true"></div>

  <div class="top">
    <span class="badge"><svg viewBox="0 0 24 24"><use href="#i-spark"/></svg>HD Result</span>
    <button class="close" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
  </div>

  <div class="thumb" aria-hidden="true"><div class="scene"></div></div>

  <div class="center" id="center">
    <div class="eye" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-eye-off"/></svg></div>
    <h2>Your result is ready</h2>
    <p>Preview is locked. Unlock to reveal the full-resolution image and download it.</p>
    <div class="perks">
      <span class="perk"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg>Full resolution</span>
      <span class="perk"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg>No watermark</span>
    </div>
  </div>

  <div class="actions">
    <button class="unlock" type="button" id="unlock">
      <svg class="lock" viewBox="0 0 24 24"><use href="#i-lock"/></svg>Unlock
      <span class="cost"><span class="coin" aria-hidden="true"></span>20</span>
    </button>
    <p class="subhint">You have <b>935 coins</b> — you'll have 915 left</p>
  </div>
</section>

<script>
(() => {
  const card = document.getElementById('card');
  const btn = document.getElementById('unlock');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let unlocked = false;

  function coinBurst(el) {
    if (reduceMotion || typeof Element.prototype.animate !== 'function') return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const cols = ['#e046bf', '#7b52ff', '#ffd83f', '#ff8fc0'];
    for (let i = 0; i < 20; i++) {
      const s = document.createElement('span');
      s.className = 'burst'; s.style.background = cols[i % cols.length];
      s.style.left = (cx - 5) + 'px'; s.style.top = (cy - 5) + 'px';
      document.body.appendChild(s);
      const a = (Math.PI * 2 * i) / 20 + Math.random() * .4, d = 70 + Math.random() * 100;
      s.animate([
        { transform: 'translate(0,0) scale(.4)', opacity: 1 },
        { transform: 'translate(' + Math.cos(a) * d + 'px,' + (Math.sin(a) * d - 30) + 'px) scale(1)', opacity: 1, offset: .6 },
        { transform: 'translate(' + Math.cos(a) * d * 1.1 + 'px,' + (Math.sin(a) * d + 50) + 'px) scale(.7)', opacity: 0 }
      ], { duration: 850 + Math.random() * 300, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => s.remove();
    }
  }

  btn.addEventListener('click', () => {
    if (!unlocked) {
      unlocked = true;
      card.classList.add('unlocked');
      coinBurst(btn);
      btn.innerHTML = 'Unlocked ✓';
      // ▼ Deduct coins and load the full-resolution result here.
    } else {
      unlocked = false;
      card.classList.remove('unlocked');
      btn.innerHTML = '<svg class="lock" viewBox="0 0 24 24"><use href="#i-lock"/></svg>Unlock <span class="cost"><span class="coin" aria-hidden="true"></span>20</span>';
    }
  });

  document.querySelector('.close').addEventListener('click', () => { /* wire to your modal close */ });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelector('.close').click(); });
})();
</script>
</body>
</html>
